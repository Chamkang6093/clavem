[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clavem"]

[project]
name = "clavem"
version = "0.1.0"
description = "Small async TLS-PSK message channels."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cham" }]
keywords = ["asyncio", "tls", "psk", "messaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Chamkang6093/clavem"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PTH", "RUF"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
line-ending = "lf"
