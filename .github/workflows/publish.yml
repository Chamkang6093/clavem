name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require tag to match package version
        run: python -c 'import os, tomllib; from pathlib import Path; v = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + v'
      - name: Build package
        run: uv build --no-sources
      - name: Check wheel import and PSK support
        run: uv run --with dist/*.whl --no-project -- python -I -c "import ssl; from clavem.transport import connect, serve; assert ssl.HAS_PSK"
      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clavem/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
